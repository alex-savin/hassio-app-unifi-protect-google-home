---
name: "UniFi Protect → Google Home"
version: "0.3.25"
slug: "unifi-protect-google-home"
description: >-
  Bridge UniFi Protect cameras to Google Home via WebRTC (Cloud-to-Cloud CameraStream).
url: "https://github.com/alex-savin/hassio-app-unifi-protect-google-home"
arch:
  - amd64
startup: services
init: false
# Ingress: serves the autodiscovery + setup UI inside Home Assistant.
ingress: true
ingress_port: 8100
panel_icon: mdi:cctv
panel_title: "UniFi Protect"
# Supervisor API access is required so the setup UI can write add-on
# options and trigger a restart after the user picks a controller.
hassio_api: true
hassio_role: manager
# Container listens on 8099 internally; exposed on host port 8199 by default
# to avoid colliding with other services. Adjust in the add-on's Network panel
# if 8199 is busy. Reverse-proxy this host port behind your public HTTPS URL
# so Google can reach the OAuth + fulfillment + WebRTC-signaling endpoints.
ports:
  8099/tcp: 8199
ports_description:
  8099/tcp: >-
    HTTP endpoint (fulfillment, OAuth, WebRTC signaling). Reverse-proxy this
    host port behind your public HTTPS URL.
options:
  unifi:
    host: "unifi.local"
    username: ""
    password: ""
    verify_tls: false
  google:
    project_id: ""
    service_account_json: ""
    oauth_client_id: ""
    oauth_client_secret: ""
    enable_homegraph: true
  bridge:
    public_base_url: ""
    listen_addr: "0.0.0.0:8099"
    stream_token_secret: ""
    consent_password: ""
    agent_user_id: "unifi-protect-bridge"
    log_level: "info"
schema:
  unifi:
    host: str
    username: str
    password: password
    verify_tls: bool
  google:
    project_id: str
    service_account_json: str
    oauth_client_id: str
    oauth_client_secret: password
    enable_homegraph: bool?
  bridge:
    public_base_url: url?
    listen_addr: str
    stream_token_secret: password
    consent_password: password
    agent_user_id: str
    log_level: "list(debug|info|warn|error)?"
image: "ghcr.io/alex-savin/unifi-protect-google-home"
