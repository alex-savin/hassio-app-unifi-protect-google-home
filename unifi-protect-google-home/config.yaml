---
name: "UniFi Protect → Google Home"
version: "0.1.0"
slug: "unifi-protect-google-home"
description: >-
  Bridge UniFi Protect cameras to Google Home via WebRTC (Cloud-to-Cloud CameraStream).
url: "https://github.com/alex-savin/hassio-app-unifi-protect-google-home"
arch:
  - amd64
startup: services
init: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: >-
    HTTP endpoint (fulfillment, OAuth, WebRTC signaling). Reverse-proxy this behind your HA external URL.
options:
  unifi:
    host: "unifi.local"
    username: ""
    password: ""
    verify_tls: false
  google:
    project_id: ""
    service_account_json: ""
    oauth_client_id: ""
    oauth_client_secret: ""
    enable_homegraph: true
  bridge:
    public_base_url: ""
    listen_addr: "0.0.0.0:8099"
    stream_token_secret: ""
    consent_password: ""
    agent_user_id: "unifi-protect-bridge"
    log_level: "info"
schema:
  unifi:
    host: str
    username: str
    password: password
    verify_tls: bool
  google:
    project_id: str
    service_account_json: str
    oauth_client_id: str
    oauth_client_secret: password
    enable_homegraph: bool?
  bridge:
    public_base_url: url
    listen_addr: str
    stream_token_secret: password
    consent_password: password
    agent_user_id: str
    log_level: "list(debug|info|warn|error)?"
image: "ghcr.io/alex-savin/unifi-protect-google-home"
