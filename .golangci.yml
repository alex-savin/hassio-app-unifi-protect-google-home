version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - revive

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    gosec:
      excludes:
        # G304 (file inclusion via variable): every dynamic path here is
        # operator-controlled add-on config (options.json, sync_state.json,
        # stream_secret), not user input.
        - G304
        # G115 (integer overflow conversions): RTP timestamp math relies on
        # deliberate 32-bit wrap; load-bearing sites carry their own
        # nolint markers with reasons.
        - G115
        # G124 (cookie attributes): only fires on test fixtures.
        - G124
        # G705/G706 (taint XSS / log injection): false positives — the
        # bridge logs its own camera IDs and writes video bytes, not
        # user-controlled markup.
        - G705
        - G706

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
