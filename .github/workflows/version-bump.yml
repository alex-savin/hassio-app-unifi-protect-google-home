---
name: Bump version

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 0.3.1). Required."
        required: true

env:
  ADDON_SLUG: unifi-protect-google-home

permissions:
  contents: read

jobs:
  bump-and-release:
    name: Bump version and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump config.yaml + prepend CHANGELOG.md
        id: bump
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          CONFIG="${ADDON_SLUG}/config.yaml"
          CHANGELOG="${ADDON_SLUG}/CHANGELOG.md"
          yq eval -i ".version = \"${VERSION}\"" "${CONFIG}"
          # Require a real changelog entry instead of inserting a junk
          # placeholder — write the CHANGELOG section before releasing.
          if ! grep -qE "^## ${VERSION}( |$)" "${CHANGELOG}"; then
            echo "::error::CHANGELOG.md has no '## ${VERSION}' section — add release notes before bumping."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Release ${{ steps.bump.outputs.version }}"
          file_pattern: >-
            unifi-protect-google-home/config.yaml
            unifi-protect-google-home/CHANGELOG.md
          branch: main
          tagging_message: "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ steps.bump.outputs.version }}"
          name: "Release ${{ steps.bump.outputs.version }}"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Releases created with GITHUB_TOKEN never fire the `release:
      # published` trigger (GitHub suppresses workflow-from-workflow
      # events), so dispatch the image build explicitly — workflow_dispatch
      # is exempt from that suppression.
      - name: Trigger image release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh workflow run release.yml
          --repo "${{ github.repository }}"
          --ref main
          -f ref="v${{ steps.bump.outputs.version }}"
