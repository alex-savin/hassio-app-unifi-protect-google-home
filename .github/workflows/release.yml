---
name: Release

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (defaults to main)"
        required: false
        default: main

env:
  ADDON_SLUG: unifi-protect-google-home

permissions:
  contents: read

jobs:
  version:
    name: Read add-on version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Read add-on version
        id: info
        run: |
          VERSION="$(yq eval '.version' "${ADDON_SLUG}/config.yaml")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build & push image (${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build and push add-on image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: >-
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{ env.ADDON_SLUG }}
          image-tags: |
            ${{ needs.version.outputs.version }}
            latest
          context: ./${{ env.ADDON_SLUG }}
          push: "true"
          version: ${{ needs.version.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: '["amd64", "aarch64"]'
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.ADDON_SLUG }}
          image-tags: |
            ${{ needs.version.outputs.version }}
            latest
