---
name: CD

"on":
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (leave empty for config.yaml version)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  information:
    name: Gather information
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      name: ${{ steps.info.outputs.name }}
      slug: ${{ steps.info.outputs.slug }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "."

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(yq '.version' config.yaml)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
  build:
    name: Build ${{ matrix.arch }}
    needs: information
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: ${{ fromJson(needs.information.outputs.architectures) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app
        uses: home-assistant/builder@2026.03.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target . \
            --version "${{ needs.information.outputs.version }}" \
            --docker-hub ${{ env.REGISTRY }}/${{ github.repository_owner }} \
            --no-latest \
            --addon
  update-config:
    name: Update config version
    needs:
      - information
      - build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in config.yaml
        run: |
          VERSION="${{ needs.information.outputs.version }}"
          yq -i ".version = \"${VERSION}\"" config.yaml
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: >
            Bump version to ${{ needs.information.outputs.version }}
          file_pattern: "config.yaml"
          branch: main
