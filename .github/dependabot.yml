---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # go.mod and the Dockerfile live in the add-on subdirectory, not the
  # repo root — pointing these at / makes Dependabot silently do nothing.
  - package-ecosystem: docker
    directory: /unifi-protect-google-home
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: gomod
    directory: /unifi-protect-google-home
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
